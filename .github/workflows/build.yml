name: Apple Silicon desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
      - name: Install USB library
        run: brew install libusb
      - name: Install dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Test desktop and worker
        run: python -m unittest discover -s tests -v
      - name: Build native macOS app
        run: python tools/build_macos.py
      - name: Verify bundled worker and USB library
        run: python tools/check_bundle.py
      - name: Package app
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--version "${GITHUB_REF_NAME#v}")
          fi
          python tools/package_macos.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ILCE-Toolkit-macOS-arm64
          if-no-files-found: error
          path: |
            dist/ILCE-Toolkit-*-macos-arm64.zip
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'CaskLabs/ILCE-Toolkit'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ILCE-Toolkit-macOS-arm64
          path: dist
      - name: Verify release download
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --verify-tag --latest --title "ILCE Toolkit $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
