name: Apple Silicon desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
      - name: Install USB library
        run: brew install libusb
      - name: Install dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Test desktop and worker
        run: python -m unittest discover -s tests -v
      - name: Build native macOS app
        run: python tools/build_macos.py
      - name: Verify bundled worker and USB library
        run: python tools/check_bundle.py
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/ILCE Toolkit.app' dist/ILCE-Toolkit-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ILCE-Toolkit-macOS-arm64
          path: dist/ILCE-Toolkit-arm64.zip
